    <script>
        // --- State Management ---
        const prices = {
            '꽈배기': 1000,
            '팥도너츠': 1000,
            '찰도너츠': 1000,
            '고기만두': 1000,
            '김치만두': 1000
        };

        const quantities = {
            '꽈배기': 0,
            '팥도너츠': 0,
            '찰도너츠': 0,
            '고기만두': 0,
            '김치만두': 0
        };

        // --- Mobile Menu Toggle ---
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // --- Menu Filter Tabs ---
        function filterMenu(category) {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-brand', 'text-white', 'active');
                btn.classList.add('bg-white', 'text-gray-700');
            });

            event.target.classList.remove('bg-white', 'text-gray-700');
            event.target.classList.add('bg-brand', 'text-white', 'active');

            const items = document.querySelectorAll('.menu-item');
            items.forEach(item => {
                if (category === 'all') {
                    item.style.display = 'flex';
                } else if (item.classList.contains(category)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // --- Order Calculator Logic ---
        function updateQty(itemKey, delta) {
            quantities[itemKey] = Math.max(0, quantities[itemKey] + delta);
            
            // Update UI elements
            document.getElementById(`qty-${itemKey}`).textContent = quantities[itemKey];
            const itemTotal = quantities[itemKey] * prices[itemKey];
            document.getElementById(`price-${itemKey}`).textContent = itemTotal.toLocaleString() + ' 원';

            recalculateTotal();
        }

        function addToCalc(itemName, price) {
            let key = null;
            if (itemName.includes('꽈배기')) key = '꽈배기';
            else if (itemName.includes('팥도너츠')) key = '팥도너츠';
            else if (itemName.includes('찰도너츠')) key = '찰도너츠';
            else if (itemName.includes('고기만두')) key = '고기만두';
            else if (itemName.includes('김치만두')) key = '김치만두';

            if (key) {
                updateQty(key, 1);
                showToast(`'${itemName}'가 계산기에 추가되었습니다.`, 'success');
            } else if (itemName.includes('모듬')) {
                updateQty('꽈배기', 3);
                updateQty('팥도너츠', 3);
                updateQty('고기만두', 2);
                updateQty('김치만두', 2);
                showToast('모듬 세트 수량(총 10개)이 계산기에 적용되었습니다!', 'success');
            }

            // Scroll gently to calculator
            document.getElementById('calculator').scrollIntoView({ behavior: 'smooth' });
        }

        function recalculateTotal() {
            let totalCount = 0;
            let totalPrice = 0;

            for (const key in quantities) {
                totalCount += quantities[key];
                totalPrice += quantities[key] * prices[key];
            }

            document.getElementById('total-count').textContent = totalCount + ' 개';
            document.getElementById('total-price').textContent = totalPrice.toLocaleString() + ' 원';
        }

        function resetCalc() {
            for (const key in quantities) {
                quantities[key] = 0;
                document.getElementById(`qty-${key}`).textContent = '0';
                document.getElementById(`price-${key}`).textContent = '0 원';
            }
            recalculateTotal();
            showToast('계산기가 초기화되었습니다.');
        }

        function sendOrderSMS() {
            let totalCount = 0;
            let orderSummary = [];

            for (const key in quantities) {
                if (quantities[key] > 0) {
                    totalCount += quantities[key];
                    orderSummary.push(`${key} ${quantities[key]}개`);
                }
            }

            if (totalCount === 0) {
                showToast('메뉴 수량을 1개 이상 선택해 주세요!', 'warning');
                return;
            }

            let totalPrice = Object.keys(quantities).reduce((acc, k) => acc + quantities[k] * prices[k], 0);
            const msgBody = `[금손수제만두 예약주문]\n- 주문목록: ${orderSummary.join(', ')}\n- 총 수량: ${totalCount}개\n- 총 금액: ${totalPrice.toLocaleString()}원\n\n픽업 예정 시간을 답장해 주세요!`;

            window.location.href = `sms:01000000000?body=${encodeURIComponent(msgBody)}`;
            showToast('문자 앱으로 주문 내용이 연결되었습니다!', 'success');
        }

        // --- Toast Messenger Utility ---
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.textContent = message;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-yellow-400 text-xl';
            } else if (type === 'warning') {
                toastIcon.className = 'fa-solid fa-triangle-exclamation text-amberGold text-xl';
            } else {
                toastIcon.className = 'fa-solid fa-info-circle text-blue-400 text-xl';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // --- Review Modal Handling ---
        function openReviewModal() {
            document.getElementById('review-modal').classList.remove('hidden');
        }

        function closeReviewModal() {
            document.getElementById('review-modal').classList.add('hidden');
        }

        function submitReview() {
            const name = document.getElementById('review-name').value.trim() || '익명 단골';
            const text = document.getElementById('review-text').value.trim();

            if (!text) {
                showToast('후기 내용을 입력해 주세요!', 'warning');
                return;
            }

            const reviewsContainer = document.getElementById('reviews-container');
            const today = new Date().toISOString().split('T')[0].replace(/-/g, '.');

            const newReviewHtml = `
                <div class="bg-amberLight/40 p-6 rounded-2xl border border-amber-200 shadow-sm relative">
                    <div class="flex text-yellow-400 mb-3 text-sm">
                        <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                    </div>
                    <p class="text-gray-700 text-sm leading-relaxed mb-4">"${text}"</p>
                    <div class="flex justify-between items-center text-xs text-gray-500 pt-3 border-t border-amber-200">
                        <span class="font-bold text-gray-800">${name} 님</span>
                        <span>${today}</span>
                    </div>
                </div>
            `;

            reviewsContainer.insertAdjacentHTML('afterbegin', newReviewHtml);
            closeReviewModal();
            document.getElementById('review-name').value = '';
            document.getElementById('review-text').value = '';
            showToast('소중한 후기가 등록되었습니다. 감사합니다!', 'success');
        }

        // --- Copy Address Helper ---
        function copyAddress() {
            const addressText = "서울특별시 ○○구 전통시장로 123 소담 수제만두 & 찹쌀꽈배기";
            const tempInput = document.createElement('textarea');
            tempInput.value = addressText;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast('가게 주소가 클립보드에 복사되었습니다!');
        }
    </script>
